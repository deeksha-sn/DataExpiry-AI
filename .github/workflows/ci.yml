name: DATAEXPIRY-AI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Verify imports & environment configuration
        run: |
          python -c "import fastapi, sqlalchemy, pydantic, httpx; print('Core dependencies imported successfully.')"

      - name: Run automated test suite
        run: |
          pytest
        env:
          ENVIRONMENT: development
          ALLOW_DEV_HEADER_AUTH: "false"

  frontend-build:
    name: Frontend Lint & Production Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run TypeScript typecheck / lint
        working-directory: frontend
        run: |
          npm run lint

      - name: Run production build
        working-directory: frontend
        run: |
          npm run build
